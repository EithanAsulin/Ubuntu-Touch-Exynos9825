# Mount device partitions and install the D2S Android compatibility overlays.

description "Mount device partitions"

start on (startup
    and started udev)

emits mounted-android

task

script
    mkdir -p /dev/cpuset
    mount none /dev/cpuset -t cpuset -o nodev,noexec,nosuid

    /usr/sbin/mount-android.sh

    # The Halium GSI disables Android audio services by default. D2S only has
    # a 32-bit primary audio HAL, so keep the service enabled and let the
    # 64-bit PulseAudio module reach it through audio.hidl_compat.
    mount -o bind /opt/halium-overlay/system/etc/init/init.disabled.rc /var/lib/lxc/android/rootfs/system/etc/init/init.disabled.rc
    mount -o bind /system/lib64/hw/audio.hidl_compat.default.so /vendor/lib64/hw/audio.primary.default.so

    # Keep vndbinder service discovery in the same binder domain as Halium.
    mount -o bind /opt/halium-overlay/vendor/bin/vndservicemanager /android/vendor/bin/vndservicemanager

    if [ -d /android/metadata ]; then
        mount -o bind /android/metadata /var/lib/lxc/android/rootfs/metadata
    fi

    initctl emit -n mounted-android
end script
