# The D2S Halium 11 port cannot use the Exynos HWC module with Mir.  This is
# the framebuffer fallback used by the upstream UBports D2S port, adapted for
# Focal's lsc-wrapper configuration hook.
unset MIR_ANDROID_FORCE_HWC2
LSC_FLAGS="--enable-num-framebuffers-quirk=true --disable-overlays=false"

# Ensure the binderized composer loads the real Exynos module before hiding
# that module from Mir's legacy-HAL probe.
if [ "$(getprop init.svc.vendor.hwcomposer-2-2 2>/dev/null)" != "running" ]; then
    setprop ctl.start vendor.hwcomposer-2-2 2>/dev/null || true
    tries=0
    while [ "$(getprop init.svc.vendor.hwcomposer-2-2 2>/dev/null)" != "running" ] && \
          [ "$tries" -lt 50 ]; do
        tries=$((tries + 1))
        sleep 0.1
    done
fi

if [ "$(getprop init.svc.vendor.hwcomposer-2-2 2>/dev/null)" = "running" ] && \
   [ -e /vendor/lib64/hw/hwcomposer.exynos9825.so ] && \
   ! mountpoint -q /vendor/lib64/hw/hwcomposer.exynos9825.so; then
    mount --bind /dev/null /vendor/lib64/hw/hwcomposer.exynos9825.so || true
fi
